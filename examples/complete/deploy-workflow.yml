# Template: copy to .github/workflows/deploy.yml in the repo that deploys these guardrails.
# It is NOT active in this repository (this repo only publishes modules).
#
# Flow (no AWS keys stored anywhere, credentials come from the github-oidc module):
#   pull request  -> plan with the read-only role, plan posted as a PR comment
#   merge to main -> plan saved as an artifact -> "production" environment approval -> apply that exact plan
#
# Setup:
#   1. Deploy examples/complete with github_repository set.
#   2. Repository variables: AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN, AWS_REGION (from the github_roles output).
#   3. Settings > Environments > production: add required reviewers.
#   4. Enable the backend "s3" block in versions.tf.

name: Deploy FinOps guardrails

on:
  pull_request:
    paths: ["**.tf", "**.tfvars", ".github/workflows/deploy.yml"]
  push:
    branches: [main]
    paths: ["**.tf", "**.tfvars", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  id-token: write # required to request the OIDC token

concurrency:
  group: terraform-deploy # never run two plans/applies against the same state at once
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  WORKING_DIR: . # change if the Terraform root is in a subfolder

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # to comment the plan on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - run: terraform -chdir="$WORKING_DIR" init -input=false
      - run: terraform -chdir="$WORKING_DIR" plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

      - name: Save plan for the apply job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

  apply:
    if: github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: production # waits here for a required reviewer; must match apply_environment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - run: terraform -chdir="$WORKING_DIR" init -input=false
      # Applies exactly the reviewed plan; fails if state changed since it was made.
      - run: terraform -chdir="$WORKING_DIR" apply -input=false tfplan
